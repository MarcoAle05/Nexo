name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  interfaz:
    name: Interfaz (tests de JS y build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  backend:
    name: Backend (formato y tests de Rust)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Formato
        run: cargo fmt --check
      # Las que pide la guía de Tauri para Debian/Ubuntu:
      # https://v2.tauri.app/start/prerequisites/#linux
      - name: Dependencias de Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # Tauri exige que exista la carpeta del frontend al compilar.
      - name: Carpeta del frontend
        run: mkdir -p ../dist
      - name: Tests
        run: cargo test --no-default-features

  core:
    name: nexo-core (sin las dependencias de Tauri)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # A propósito, este job NO instala las dependencias de sistema de Tauri: que compile
      # y pase aquí es la prueba de que nexo-core no depende de Tauri ni de WebKitGTK.
      - name: Compilación
        run: cargo build -p nexo-core
      - name: Tests
        run: cargo test -p nexo-core
      - name: Formato
        run: cargo fmt -p nexo-core --check
      - name: Clippy
        run: cargo clippy -p nexo-core -- -D warnings
