[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.0", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
trash = "5.2.9"
futures-util = "0.3.34"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
tokio = { version = "1.53.1", features = ["macros", "sync"] }
reqwest = { version = "0.13.5", features = ["json", "stream"] }
portable-pty = "0.9.0"
uuid = { version = "1.26.1", features = ["v4"] }
memchr = "2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }
