[package]
name = "nexo-mcp"
version = "0.1.0"
description = "Servidor MCP de solo lectura sobre un vault de Nexo"
license = "MIT"
edition = "2024"
rust-version = "1.90"

[[bin]]
name = "nexo-mcp"
path = "src/main.rs"

[dependencies]
nexo-core = { path = "../nexo-core" }
rmcp = { version = "3.5.1", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
